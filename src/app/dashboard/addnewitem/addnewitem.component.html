<body class="mt-4 mb-4">
  <!-- Top bar with Add Menu (left) and Search (right) -->
  <div class="flex items-center justify-between mb-4">
    <!-- Add Menu Button -->
    <button class="bg-[#6b4e3d] text-white hover:bg-[#4e362b] font-medium py-2 px-4 rounded-lg shadow-sm transition"
      (click)="openModal()">
      Add Menu
    </button>

    <!-- Search Input -->
    <input type="text" placeholder="Search..." (input)="onQuickFilterChanged($event)"
      class="p-2 w-64 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#a37e5c] bg-white" />
  </div>

  <!-- Table -->
  <ag-grid-angular (gridReady)="onGridReady($event)" class="ag-theme-alpine" style="width: 100%; height: 400px"
    [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10"
    class="ag-theme-alpine custom-grid">
  </ag-grid-angular>

  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-[#f9f6f1] rounded-2xl shadow-xl w-96 p-4 relative">
      <!-- Header -->
      <h3 class="text-lg font-bold mb-4 text-[#4e362b]">
        {{ isEdit ? "Edit" : "Add" }}
      </h3>

      <!-- Form -->
      <form class="space-y-3" #menuform="ngForm" (ngSubmit)="onSubmit(menuform)">
        <!-- Item Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">
            Item Name <span class="text-danger">*</span>
          </label>
          <input type="text" [(ngModel)]="name" id="name" name="name"
            class="mt-0.5 block w-full rounded-lg border border-gray-300 shadow-sm p-2 bg-white focus:ring-2 focus:ring-[#a37e5c] focus:outline-none"
            placeholder="e.g., Waffle" required #nameRef="ngModel" />
          <div class="text-danger1" *ngIf="nameRef.invalid && nameRef.touched">required</div>
        </div>

        <!-- Category -->
        <div>
          <label for="category" class="block text-sm font-medium text-gray-700">
            Category<span class="text-danger">*</span>
          </label>
          <input type="text" id="category" [(ngModel)]="category" name="category"
            class="mt-0.5 block w-full rounded-lg border border-gray-300 shadow-sm p-2 bg-white focus:ring-2 focus:ring-[#a37e5c]"
            placeholder="e.g., Cheesecake" required #CategoryRef="ngModel" />
          <div class="text-danger1" *ngIf="CategoryRef.invalid && CategoryRef.touched">required</div>
        </div>

        <!-- Price -->
        <div>
          <label for="price" class="block text-sm font-medium text-gray-700">
            Price<span class="text-danger">*</span>
          </label>
          <input type="number" [(ngModel)]="price" id="price" name="price"
            class="mt-0.5 block w-full rounded-lg border border-gray-300 shadow-sm p-2 bg-white focus:ring-2 focus:ring-[#a37e5c]"
            placeholder="e.g., 120.50" required #priceRef="ngModel" />
          <div class="text-danger1" *ngIf="priceRef.invalid && priceRef.touched">required</div>
        </div>

        <!-- Image -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Image<span class="text-danger">*</span></label>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" [(ngModel)]="imageurl" name="filename"
            class="mt-0.5 block w-full text-sm text-gray-700 border border-gray-300 rounded-lg cursor-pointer bg-white focus:outline-none"
            #imageRef="ngModel" />
          <div class="text-danger1" *ngIf="imageRef.invalid && imageRef.touched">required</div>
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="block text-sm font-medium text-gray-700">
            Description<span class="text-danger">*</span>
          </label>
          <textarea id="description" [(ngModel)]="description" name="description" rows="3"
            class="mt-0.5 block w-full rounded-lg border border-gray-300 shadow-sm p-2 bg-white focus:ring-2 focus:ring-[#a37e5c]"
            placeholder="A brief description of the item." required #descRef="ngModel"></textarea>
          <div class="text-danger1" *ngIf="descRef.invalid && descRef.touched">required</div>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit"
            class="w-full py-2.5 rounded-xl text-white font-semibold bg-[#6b4e3d] hover:bg-[#4e362b] shadow-md transition">
            {{ isEdit ? "Edit" : "Add" }}
          </button>
        </div>
      </form>

      <!-- Close Button -->
      <button class="absolute top-2 right-2 text-gray-500 hover:text-[#6b4e3d] transition" (click)="closeModal()">
        ✕
      </button>
    </div>
  </div>
</body>
