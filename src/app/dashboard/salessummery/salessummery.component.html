<div class="p-3 sm:p-4 flex flex-col gap-2 font-sans h-full">
  <!-- COMPACT DATE FILTER TOOLBAR (At Top) -->
  <div class="flex items-center justify-between flex-wrap gap-2 px-1">
    <!-- Presets -->
    <div class="inline-flex items-center bg-white p-0.5 rounded-lg border border-[#E8DEC9] text-xs font-medium shadow-2xs">
      <button
        type="button"
        (click)="setPreset('all')"
        [class]="selectedPreset === 'all' 
          ? 'bg-[#EA580C] text-white font-semibold shadow-2xs' 
          : 'text-gray-600 hover:text-gray-900'"
        class="px-2.5 py-1 rounded-md transition cursor-pointer"
      >
        All
      </button>
      <button
        type="button"
        (click)="setPreset('today')"
        [class]="selectedPreset === 'today' 
          ? 'bg-[#EA580C] text-white font-semibold shadow-2xs' 
          : 'text-gray-600 hover:text-gray-900'"
        class="px-2.5 py-1 rounded-md transition cursor-pointer"
      >
        Today
      </button>
      <button
        type="button"
        (click)="setPreset('7days')"
        [class]="selectedPreset === '7days' 
          ? 'bg-[#EA580C] text-white font-semibold shadow-2xs' 
          : 'text-gray-600 hover:text-gray-900'"
        class="px-2.5 py-1 rounded-md transition cursor-pointer"
      >
        7 Days
      </button>
      <button
        type="button"
        (click)="setPreset('30days')"
        [class]="selectedPreset === '30days' 
          ? 'bg-[#EA580C] text-white font-semibold shadow-2xs' 
          : 'text-gray-600 hover:text-gray-900'"
        class="px-2.5 py-1 rounded-md transition cursor-pointer"
      >
        30 Days
      </button>
      <button
        type="button"
        (click)="setPreset('thisMonth')"
        [class]="selectedPreset === 'thisMonth' 
          ? 'bg-[#EA580C] text-white font-semibold shadow-2xs' 
          : 'text-gray-600 hover:text-gray-900'"
        class="px-2.5 py-1 rounded-md transition cursor-pointer"
      >
        This Month
      </button>
    </div>

    <!-- Custom Range Picker -->
    <div class="flex items-center gap-1.5 bg-white border border-[#E8DEC9] rounded-lg px-2.5 py-1 text-xs shadow-2xs">
      <span class="text-gray-500 font-medium cursor-pointer" (click)="openPickerByRef(fromInput)">From:</span>
      <input
        #fromInput
        type="date"
        [(ngModel)]="customFrom"
        (click)="openDatePicker($event)"
        class="text-xs text-gray-700 bg-transparent focus:outline-none cursor-pointer"
      />
      <span class="text-gray-500 font-medium cursor-pointer" (click)="openPickerByRef(toInput)">To:</span>
      <input
        #toInput
        type="date"
        [(ngModel)]="customTo"
        (click)="openDatePicker($event)"
        class="text-xs text-gray-700 bg-transparent focus:outline-none cursor-pointer"
      />
      <button
        type="button"
        (click)="applyCustomFilter()"
        [disabled]="!customFrom || !customTo"
        class="px-2.5 py-0.5 text-xs font-semibold text-white bg-[#EA580C] hover:bg-[#C2410C] rounded transition disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer shadow-2xs"
      >
        Apply
      </button>
      <button
        *ngIf="selectedPreset !== 'all' || customFrom || customTo"
        type="button"
        (click)="resetFilter()"
        class="px-2 py-0.5 text-xs text-[#EA580C] bg-[#FFF5EB] hover:bg-[#FEEAD8] border border-[#FDBA74]/70 rounded transition cursor-pointer font-medium"
      >
        Reset
      </button>

      <!-- Export Excel Button -->
      <button
        type="button"
        (click)="exportSummaryToExcel()"
        class="px-2.5 py-0.5 text-xs font-semibold text-white bg-[#107C41] hover:bg-[#0B5C30] active:bg-[#074020] rounded transition cursor-pointer shadow-2xs flex items-center gap-1 whitespace-nowrap"
        title="Export sales summary to Excel (.xlsx)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
          <path d="M13 12h3v2h-3v-2zm-4 0h2v2H9v-2zm0 4h2v2H9v-2zm4 0h3v2h-3v-2z"/>
        </svg>
        <span>Export Excel</span>
      </button>
    </div>
  </div>

  <!-- CHART EXACTLY AS IT WAS IN FULL SIZE -->
  <div id="main" class="w-full flex-1" style="min-height: 480px; height: calc(100vh - 130px);"></div>
</div>
