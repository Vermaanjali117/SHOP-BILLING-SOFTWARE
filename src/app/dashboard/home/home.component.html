<div class="p-4">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-[#4e362b]">Order Track</h2>
    <input
      (input)="onSearchChange($event)"
      type="text"
      placeholder="Search menu here..."
      class="px-4 py-2 rounded-xl border border-gray-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-[#a37e5c]"
    />
  </div>

  <!-- Categories -->
 <div class="mb-4">
    <div class="flex gap-2 overflow-x-auto py-1 px-1 scrollbar-hide">
      <button
        *ngFor="let category of catagory"
        (click)="selectCategory(category)"
        [ngClass]="{
          'bg-[#6b4e3d] text-white': selectedCategory === category,
          'bg-[#f3ede7] text-[#4e362b]': selectedCategory !== category
        }"
        class="flex-shrink-0 px-4 py-2 rounded-full font-medium whitespace-nowrap transition-all max-w-[160px] truncate"
      >
        {{ category }}
      </button>
    </div>
  </div>

  <!-- Product Grid -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    <div *ngFor="let product of showproduct">
      <div
        *ngIf="product.category"
        class="bg-white rounded-2xl shadow-md overflow-hidden relative border border-gray-200 hover:shadow-lg transition"
      >
        <!-- Product Image -->
        <img
          [src]="product.image"
          alt="{{ product.name }}"
          class="w-full h-40 object-cover"
        />

        <!-- Product Details -->
        <div class="p-4">
          <h3 class="text-md font-semibold text-gray-800 truncate">
            {{ product.name }}
          </h3>
          <p class="text-sm text-gray-500">{{product.decription}}</p>
          <p class="text-lg font-bold text-[#6b4e3d] mt-2">
            ₹{{ product.price }}
          </p>
        </div>

        <!-- Add / Counter button -->
        <div class="absolute bottom-4 right-4">
          <!-- ADD button -->
          <button
            *ngIf="getQuantity(product) === 0"
            (click)="addToCart(product)"
            class="px-4 py-1 text-white bg-[#6b4e3d] rounded-full hover:bg-[#4e362b] font-semibold shadow-sm transition"
          >
            ADD
          </button>

          <!-- Counter -->
          <div
            *ngIf="getQuantity(product) > 0"
            class="flex items-center bg-[#6b4e3d] text-white px-3 py-1 rounded-full shadow-sm space-x-2"
          >
            <button (click)="decreaseQuantity(product)" class="font-bold">
              −
            </button>
            <span>{{ getQuantity(product) }}</span>
            <button (click)="increaseQuantity(product)" class="font-bold">
              +
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
