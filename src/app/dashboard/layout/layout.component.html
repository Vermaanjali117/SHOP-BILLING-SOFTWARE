<div class="flex h-screen overflow-hidden bg-graph-pattern">
  <!-- SIDEBAR -->
  <aside class="sidebar-container w-64 flex-shrink-0 flex flex-col z-20">
    <!-- Brand Header (Actual Logo) -->
    <div class="sidebar-header h-16 flex items-center justify-center border-b border-[#EFE7DA]">
      <img
        src="assets/logo.png"
        alt="The Belgique Bites Co"
        class="sidebar-logo"
      />
    </div>

    <!-- Navigation Groups -->
    <nav class="sidebar-nav flex-1 overflow-y-auto px-3.5 py-1.5 space-y-3">
      <!-- Group 1: SELL -->
      <div class="nav-group">
        <span class="group-label">SELL</span>
        <ul class="nav-list space-y-1 mt-1.5 ps-0">
          <li>
            <a
              routerLink="home"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span>HOME</span>
            </a>
          </li>
          <li>
            <a
              routerLink="invoice_list"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
              <span>ORDER LIST</span>
            </a>
          </li>
          <li>
            <a
              routerLink="sales_summary"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              <span>SALES SUMMARY</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Group 2: MENU & STOCK -->
      <div class="nav-group">
        <span class="group-label">MENU & STOCK</span>
        <ul class="nav-list space-y-1 mt-1.5 ps-0">
          <li>
            <a
              routerLink="items"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
              <span>REGISTER PRODUCT</span>
            </a>
          </li>
          <li>
            <a
              routerLink="row-material-management"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path>
                <path d="M8.5 2h7"></path>
                <path d="M7 16h10"></path>
              </svg>
              <span>REGISTER INGREDIENT</span>
            </a>
          </li>
          <li>
            <a
              routerLink="add_recipe"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
              </svg>
              <span>INGREDIENT COMPOSITION</span>
            </a>
          </li>
          <li>
            <a
              routerLink="inventory-history"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                <polyline points="9 14 11 16 15 12"></polyline>
              </svg>
              <span>MATERIAL AUDIT</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Group 3: GROW -->
      <div class="nav-group">
        <span class="group-label">GROW</span>
        <ul class="nav-list space-y-1 mt-1.5 ps-0">
          <li>
            <a
              routerLink="manage_offers"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
              </svg>
              <span>MANAGE OFFERS</span>
            </a>
          </li>
          <li>
            <a
              routerLink="analyze-performance"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
              </svg>
              <span>ANALYZE PERFORMANCE</span>
            </a>
          </li>
          <li>
            <a
              routerLink="track-expenses"
              routerLinkActive="active-nav-pill"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
                <circle cx="7" cy="15" r="1"></circle>
                <line x1="12" y1="15" x2="17" y2="15"></line>
              </svg>
              <span>TRACK EXPENSES</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Top Header Bar -->
    <header class="top-navbar h-16 flex items-center justify-between px-8 z-10">
      <h1 class="brand-heading font-serif-italic">The Belgique Bites Co</h1>

      <div class="flex items-center gap-4">
        <!-- Cart Pill Button -->
        <button
          (click)="toggleCart()"
          class="cart-pill-btn"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.2"
            stroke="currentColor"
            class="w-4 h-4 mr-1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 2.25h1.5l1.5 12.75h13.5l1.5-9H6.75"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 21a.75.75 0 100-1.5.75.75 0 000 1.5zM18 21a.75.75 0 100-1.5.75.75 0 000 1.5z"
            />
          </svg>
          <span>CART</span>
          <span
            *ngIf="showcartcount > 0"
            class="cart-badge-count"
          >
            {{ showcartcount }}
          </span>
        </button>

        <!-- Logout Button -->
        <button
          (click)="logout()"
          class="logout-pill-btn"
        >
          LOGOUT
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-graph-pattern p-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
