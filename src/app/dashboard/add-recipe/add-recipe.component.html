<div class="page-container">
  <div class="header-section">
    <h2 class="title-main">Recipe Management</h2>
    
    <div class="header-actions">
      <div class="search-container">
        <input
          type="text"
          placeholder="Search menu..."
          (input)="onQuickFilterChanged($event)"
          class="search-input"
        />
      </div>
      <button class="btn btn-add-recipe shadow-sm" (click)="openAdjustStockModal()">
        <span class="me-1">+</span> Add New Recipe
      </button>
    </div>
  </div>

  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <ag-grid-angular
      style="width: 100%; height: 500px"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10"
      class="ag-theme-alpine custom-grid"
    >
    </ag-grid-angular>
  </div>

  <div class="modal-backdrop" *ngIf="showAdjustModal || showRecipeModal" (click)="closeRecipeModal()"></div>

  <div class="custom-modal" *ngIf="showAdjustModal">
    <div class="modal-box">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEdit ? "Edit Recipe" : "Create New Recipe" }}</h5>
        <button type="button" class="btn-close" (click)="closeRecipeModal()"></button>
      </div>

      <div class="modal-body">
        <div class="mb-4">
          <label class="form-label text-uppercase small fw-bold text-muted">Final Product (Item)</label>
          <ng-select
            [items]="get_item_list"
            appendTo="body"
            bindLabel="name"
            bindValue="_id"
            placeholder="Search and select an item..."
            [(ngModel)]="selectedItemId"
            [disabled]="isEdit"
            class="custom-ng-select"
          ></ng-select>
        </div>

        <label class="form-label text-uppercase small fw-bold text-muted mb-2">Required Raw Materials</label>

        <div class="table-responsive rounded-3 border mb-3">
          <table class="table table-custom m-0">
            <thead>
              <tr class="bg-light">
                <th>Material</th>
                <th width="100">Qty</th>
                <th width="100">Unit</th>
                <th width="50"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let mat of materials; index as i">
                <td>
                  <ng-select
                    [items]="get_row_material"
                    bindLabel="name"
                    bindValue="_id"
                    appendTo="body"
                    placeholder="Select material..."
                    [(ngModel)]="mat.rawMaterialId"
                    class="custom-ng-select-sm"
                  ></ng-select>
                </td>
                <td>
                  <input type="number" class="form-control form-control-sm" [(ngModel)]="mat.quantityRequired" placeholder="0.00" />
                </td>
                <td>
                  <select class="form-select form-select-sm" [(ngModel)]="mat.unit">
                    <option value="gm">gm</option>
                    <option value="kg">kg</option>
                    <option value="ml">ml</option>
                    <option value="ltr">ltr</option>
                    <option value="pcs">pcs</option>
                  </select>
                </td>
                <td class="text-center align-middle">
                  <button type="button" class="btn btn-outline-danger btn-sm delete-row-btn" (click)="removeMaterial(i)">
                    <span>&times;</span>
                  </button>
                </td>
              </tr>
              <tr *ngIf="materials.length === 0">
                <td colspan="4" class="text-center py-4 text-muted small">No materials added yet.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <button class="btn btn-outline-primary btn-sm w-100 border-dashed py-2" (click)="addMaterial()">
          + Add Material Line
        </button>
      </div>

      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-light border" (click)="closeRecipeModal()">Cancel</button>
        <button
          type="button"
          class="btn btn-save px-4"
          [disabled]="!selectedItemId || materials.length === 0"
          (click)="isEdit ? editRecipe() : saveRecipe()"
        >
          {{ isEdit ? "Update Changes" : "Save Recipe" }}
        </button>
      </div>
    </div>
  </div>
</div>
