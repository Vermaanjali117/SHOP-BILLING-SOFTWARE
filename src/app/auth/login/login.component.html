<nav class="bg-white shadow-sm p-4 flex items-center justify-between">
  <div class="text-2xl font-playfair font-bold text-[#4e362b] flex items-baseline">
    The Belgique Bites 
    <span class="text-sm font-semibold ml-1">Co</span>
  </div>
</nav>

<div class="flex h-screen">
  <!-- Left Side: Image with Overlay -->
  <div class="hidden md:block w-1/2 relative">
    <div
      class="absolute inset-0 bg-cover bg-center"
      style="background-image: url('assets/doodlewaffle.png');"
    ></div>
    <!-- Overlay -->
    <div class="absolute inset-0 bg-[#4e362b]/30"></div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="w-full md:w-1/2 flex items-center justify-center bg-[#f9f6f1] p-8">
    <div
      class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg transition transform hover:scale-[1.01]"
    >
      <div class="text-center">
        <h2 class="text-3xl font-bold text-[#4e362b] mb-2">
          Welcome Back 👋
        </h2>
        <p class="text-gray-500 mb-6">
          Login to your account to continue
        </p>
      </div>

      <form class="space-y-5">
        <div>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Email"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#6b4e3d] shadow-sm hover:shadow-md transition-all duration-300"
          />
        </div>
        <div>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#6b4e3d] shadow-sm hover:shadow-md transition-all duration-300"
          />
        </div>

        <div class="flex items-center justify-between text-sm"></div>

        <div>
          <button
            type="submit"
            (click)="login()"
            class="w-full py-3 rounded-lg bg-[#6b4e3d] text-white font-semibold shadow-md hover:bg-[#4e362b] hover:shadow-lg transition transform hover:-translate-y-0.5 active:scale-95"
          >
            Login
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
